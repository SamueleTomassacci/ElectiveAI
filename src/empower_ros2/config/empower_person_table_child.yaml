/**:
  ros__parameters:
    use_case: person_table_child_task
    task_description: "Take the peluche, go to the child and drop the peluche"
    output_root: /root/exchange/empower_data
    rgb_topic: /head_front_camera/rgb/image_raw
    depth_topic: /head_front_camera/depth/image_raw
    camera_info_topic: /head_front_camera/depth/camera_info
    pointcloud_topic: /empower/colored_pointcloud
    fixed_frame: map
    camera_frame: head_front_camera_color_optical_frame
    depth_unit_scale_to_mm: -1.0
    multi_view:
      enabled: true
      overlap_ratio: 0.15
      yaw_coverage: 6.283185307179586
      min_views: 4
      max_views: 12
      settle_time_sec: 1.0
      rotation_mode: nav2
      save_debug: true
      output_subdir: views
      merge:
        default_distance_m: 0.35
        small_object_distance_m: 0.25
        large_object_distance_m: 0.60
        z_threshold_m: 0.25
    server_host: 127.0.0.1
    server_port: 10000
    openai_api_key_file: /root/exchange/openai_api_key.txt
    centroids_topic: /pcl_centroids
    names_topic: /pcl_names
    map_frame: map
    base_frame: base_footprint
    nav_action_name: navigate_to_pose
    marker_timeout_sec: 30.0
    tf_timeout_sec: 10.0
    action_server_timeout_sec: 20.0
    nav_result_timeout_sec: 300.0
    standoff_distance: 0.8 #1.2 era
    continue_on_nav_failure: false
    child_context:
      enabled: true
      planner_description: >
        The child is present in the room but is not visible in the RGB image.
        The child is a known non-visual target.
        The child is a valid navigation target and a valid drop destination.
        If the task asks to bring an object to the child, the plan must include
        NAVIGATE to the child before dropping the object.
      aliases: ["child", "the child", "kid"]
    child_navigation:
      enabled: true
      frame_id: map
      x: 0.0
      y: 0.95
      yaw: 1.5708
      via_waypoint:
        enabled: true
        x: 3.0
        y: 0.0
        yaw: 3.14159
      aliases: ["child", "the child", "kid"]
    person_navigation:
      enabled: true
      frame_id: map
      x: 0.0
      y: 0.0
      yaw: -1.5708
      aliases: ["person", "the person", "adult", "the adult", "standing person", "adult person"]
    object_simulation:
      enabled: true
      drop_distance: 0.75
      child_delivery_table_drop_x: 0.0
      child_delivery_table_drop_y: 1.65
      child_delivery_table_drop_z: 2.0 #era 1.7
      child_delivery_table_drop_yaw: 1.5708
      hidden_x: 0.0
      hidden_y: 0.0
      hidden_z: -10.0
      world_frame: world
      robot_base_frame: base_footprint
      gz_command: gz
      gz_world_name: person_table_child_room
      gz_cli_timeout_sec: 10.0
      world_sdf_path: /root/exchange/exchange/person_table_child.world
      objects:
        book:
          aliases: ["book"]
          gazebo_entity: clear_red_book_on_right_table
          drop_z: 0.01
        computer:
          aliases: ["computer", "laptop", "laptop computer"]
          gazebo_entity: laptop_computer_on_right_table
          drop_z: 0.12
        peluche:
          aliases: ["peluche", "teddy bear", "plush toy", "stuffed animal"]
          gazebo_entity: teddy_bear_on_right_table
          drop_z: 0.01

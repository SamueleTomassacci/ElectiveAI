voice_llm_node:
  ros__parameters:
    input_mode: "text"
    llm_provider: "ollama"
    llm_base_url: "http://localhost:11434"
    llm_model: "qwen2.5:1.5b"
    llm_fallback_model: "llama3.2:1b"
    llm_timeout: 60.0
    temperature: 0.4
    max_response_tokens: 120
    max_history_turns: 4
    stt_provider: "faster_whisper"
    stt_model: "tiny"
    stt_device: "cpu"
    stt_compute_type: "int8"
    stt_device_index: -1
    language: "it"
    record_seconds: 4.0
    sample_rate: 16000
    tts_provider: "pyttsx3"
    tts_timeout: 30.0
    storytelling_max_turns: 10
    storytelling_auto_listen: true
    stt_vad_energy_threshold: 0.01
    stt_vad_silence_sec: 1.5
    stt_vad_max_duration_sec: 30.0
    piper_model_path: ""
    piper_config_path: ""
    system_prompt: "Sei TIAGo, un robot sociale in simulazione Gazebo. In questa fase puoi solo parlare con l'utente tramite voce. Non puoi ancora muoverti, afferrare oggetti, riconoscere persone o eseguire azioni fisiche da questo modulo. Rispondi sempre in italiano, in modo breve, chiaro, gentile e adatto a un'interazione con bambini e terapeuti. Se l'utente ti chiede di fare qualcosa fisicamente, spiega che per ora stai testando solo il dialogo vocale. Non inventare capacità robotiche non ancora implementate."
